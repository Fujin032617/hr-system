<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFB Teams</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #1c1e21;
  --navy2:  #242526;
  --navy3:  #3a3b3c;
  --slate:  #65676b;
  --muted:  #8a8d91;
  --border: #dadde1;
  --bg:     #f0f2f5;
  --card:   #ffffff;
  --accent: #1877f2;
  --accent2:#166fe5;
  --green:  #42b72a;
  --red:    #fa383e;
  --amber:  #f7b928;
  --purple: #9360f7;
  --cyan:   #00a4d8;
  --orange: #f77b28;
  --shadow: 0 1px 2px rgba(0,0,0,.12);
  --shadow2:0 12px 28px rgba(0,0,0,.18);
  --r:      10px;
  --r2:     12px;
  --sidebar-w: 240px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--navy);
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── SIDEBAR LAYOUT ─────────────────────────────────────────── */
#appShell { display: flex; min-height: 100vh; }

#sidebar {
  width: var(--sidebar-w);
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform .25s;
}

.sidebar-logo {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo .brand {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 0;
}
.sidebar-logo .brand span { color: var(--accent); }
.sidebar-logo .sub { font-size: 10px; color: var(--slate); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

.sidebar-user {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-info .name { color: var(--navy); font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.user-info .role-pill {
  display: inline-block;
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  padding: 1px 7px; border-radius: 20px; margin-top: 2px;
  background: #e7f3ff; color: var(--accent);
}

.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.nav-section { padding: 0 12px; margin-bottom: 4px; }
.nav-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 8px 8px 4px; font-weight: 700; }
