const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const LEG = [['RD','RESTDAY'],['SL','SICK LEAVE'],['A','ABSENT'],['NPL','NO PAID LEAVE'],['P','PRESENT'],['NPSL','NO PAID SICK LEAVE'],['S','SUSPENDED'],['VL','VACATION LEAVE'],['UT','UNDER TIME'],['HD','HALF DAY'],['BL','BEAREVEMENT LEAVE'],['PL','PATERNITY LEAVE'],['ML','MATERNITY LEAVE']];
const LEG_CLR = { RD:'',SL:'FFFF00',A:'FF0000',NPL:'1BA3B5',P:'',NPSL:'FFFF00',S:'BE424B',VL:'FFFF00',UT:'',HD:'',BL:'00FDFF',PL:'52FDC4',ML:'FC82A4' };

/* ── HELPERS ── */
function esc(t){ if(t==null)return''; const d=document.createElement('div'); d.textContent=String(t); return d.innerHTML; }
function php(n){ return '₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pld(s){ if(!s)return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayL(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function tmrStr(){ const t=new Date(); t.setDate(t.getDate()+1); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function isAH(){ return S.currentUser && ['HR','Admin'].includes(S.currentUser.role); }
function isAOH(){ return S.currentUser && ['HR','Admin','OPS'].includes(S.currentUser.role); }
function splitName(full){ const p=(full||'').trim().split(' ').filter(Boolean); if(!p.length)return{L:'',F:''}; if(p.length===1)return{L:p[0],F:''}; return{L:p[p.length-1],F:p.slice(0,-1).join(' ')}; }
function ek(uid,u){ const r=String(u?.empID||uid||'').trim(); const n=r.match(/\d+/); return{r,n:n?parseInt(n[0]):Number.MAX_SAFE_INTEGER}; }
function cmp([ua,a],[ub,b]){ const ka=ek(ua,a),kb=ek(ub,b); if(ka.n!==kb.n)return ka.n-kb.n; return ka.r.localeCompare(kb.r,undefined,{numeric:true,sensitivity:'base'}); }
function aes(){ return Object.entries(S.users).filter(([,u])=>!u.disabled).sort(cmp); }
function guc(id){ return S.users[id] || (S.currentUser?.id===id ? S.currentUser : null); }

function pTime(s){
  if(!s||!s.trim())return null; s=s.trim().toUpperCase().replace(/(\d)(AM|PM)/i,'$1 $2');
  if(s.includes(':')){ const p=s.split(':'); let h=parseInt(p[0])||0; const m=parseInt(p[1])||0; if(s.includes('PM')&&h<12)h+=12; if(s.includes('AM')&&h===12)h=0; return[h,m]; }
  const m=s.match(/(\d+)\s*(AM|PM)?/i); if(m){ let h=parseInt(m[1])||0; const pd=(m[2]||'AM').toUpperCase(); if(pd==='PM'&&h<12)h+=12; if(pd==='AM'&&h===12)h=0; return[h,0]; } return null;
}
function lateMins(ci,uid,mon){
  const u=S.users[uid]||(S.currentUser?.id===uid?S.currentUser:null);
  const slot=u?(u['out_'+mon]||''):'';
  if(!slot||!/\d{1,2}:\d{2}|\d{1,2}\s*(AM|PM)/i.test(slot))return 0;
  const p=pTime(slot.split(/[-–]/)[0].trim()); if(!p)return 0;
  const [sh,sm]=p; const sc=new Date(ci); sc.setHours(sh,sm,0,0);
  if(sh>=18 && ci.getHours()<12) sc.setDate(sc.getDate()-1);
  if(sh<6 && ci.getHours()>=18) sc.setDate(sc.getDate()+1);
  const d=ci-sc; return d<=0?0:Math.floor(d/60000);
}
function usedLv(uid,type){
  let u=0; if(!S.leaveRequests)return 0;
  Object.values(S.leaveRequests).forEach(l=>{ if(l.empID===uid && l.type===type && l.status==='Approved') u+=wDays(l.startDate,l.endDate||l.startDate,uid); });
  return u;
}
function wDays(s,e,uid){
  if(!s)return 0; const start=pld(s),end=e?pld(e):new Date(start);
  const u=guc(uid); if(!u)return 0; let d=0; const c=new Date(start);
  while(c<=end){ const m=c.getMonth(),dn=DOW[c.getDay()]; const o1=u['off1_'+m]||'',o2=u['off2_'+m]||''; if(o1!==dn&&o2!==dn)d++; c.setDate(c.getDate()+1); }
  return d;
}
function consec(uid,s,e){ const u=guc(uid); const d=wDays(s,e||s,uid); const max=(u&&u.maxConsecutiveLeave)?u.maxConsecutiveLeave:30; return{valid:d<=max,d,max}; }
function overlap(uid,s,e,excl=null){
  if(!S.leaveRequests)return false; const sd=pld(s),ed=e?pld(e):new Date(sd);
  for(const [id,l] of Object.entries(S.leaveRequests)){ if(excl&&id===excl)continue; if(l.empID!==uid)continue; if(l.status==='Rejected'||l.status==='Cancelled')continue; const es=pld(l.startDate),ee=l.endDate?pld(l.endDate):new Date(es); if(sd<=ee&&ed>=es)return true; }
  return false;
}
function canAp(req){ if(!S.currentUser)return false; const emp=S.users[req.empID]; if(!emp)return false; const cu=S.currentUser; if(cu.role==='HR')return true; if(emp.dept!==cu.dept)return false; const rh={Employee:1,OPS:2,Admin:3,HR:4}; return (rh[cu.role]||0)>(rh[emp.role]||0); }
function canCx(req){ if(!S.currentUser)return false; const cu=S.currentUser,re=S.users[req.empID]; if(cu.role==='HR')return true; if(cu.role==='Admin'&&re&&re.dept===cu.dept)return true; if(cu.id===req.empID&&req.status==='Pending')return true; return false; }

/* ── NIGHT HOURS (REVISED – NO DEFAULT, CAPPED 8h/DAY) ── */
function nightMins(ci,co){
  if(!ci||!co)return 0;
  const tm=d=>d.getHours()*60+d.getMinutes();
  let s=tm(ci), e=tm(co);
  if(e<s) e+=1440;
  return Math.max(0, Math.min(e,1800)-Math.max(s,1320));
}
function computeNightHrs(uid,mon,pS,pE){
  const att = S.attendance[uid] || {};
  let totalMins = 0;
  for(let d=pS; d<=pE; d++){
    const k = `${mon}_${d}`;
    const st = att[k] || '';
    const ci = att[`${k}_time`];
    const co = att[`${k}_out`];
    if((st==='P' || st==='RDS') && ci && co){
      const mins = nightMins(new Date(ci), new Date(co));
      totalMins += Math.min(mins, 480);  // cap 8h per day
    }
  }
  return totalMins / 60;
}

/* ── OFFLINE ── */
function qk(){ return S.currentUser ? `hr_offline_${S.currentUser.id}` : null; }
function setupOffline(){
  window.addEventListener('online',()=>{S.isOnline=true; updOff(); showToast('Connection restored! Syncing…','info'); setTimeout(procQ,1000);});
  window.addEventListener('offline',()=>{S.isOnline=false; updOff();});
  updOff(); S.autoClockOutInterval=setInterval(chkAuto,60000);
  setInterval(()=>{ if(S.isOnline && S.offlineQueue.length) procQ(); },30000);
}
function updOff(){
  const b=document.getElementById('offlineBanner'); if(b) b.style.display = S.isOnline ? 'none' : 'block';
  const q=document.getElementById('offlineQueueBanner'); if(q){ q.classList.toggle('hidden',!S.offlineQueue.length); document.getElementById('queueCount').textContent = S.offlineQueue.length; }
}
function addQ(type,data){ S.offlineQueue.push({type,data}); const k=qk(); if(k) localStorage.setItem(k,JSON.stringify(S.offlineQueue)); updOff(); }
async function procQ(){
  if(!S.offlineQueue.length || !S.isOnline) return; const fail=[];
  for(const a of S.offlineQueue){ try{ await execQ(a.type,a.data); await new Promise(r=>setTimeout(r,300)); } catch{ fail.push(a); } }
  S.offlineQueue = fail; const k=qk(); if(k) localStorage.setItem(k,JSON.stringify(S.offlineQueue));
  showToast(fail.length?`${fail.length} action(s) failed to sync`:'All queued actions synced!',fail.length?'error':'success'); updOff();
}
async function execQ(type,d){
  if(type==='clock_in'){ await update(ref(db,`attendance/${d.uid}`),d.upd); await push(ref(db,'audit_logs'),d.al); }
  else if(type==='clock_out'){ await update(ref(db,`attendance/${d.uid}`),d.upd); await push(ref(db,'audit_logs'),d.al); await push(ref(db,'notifications'),d.nt); }
  else if(type==='submit_leave'){ await push(ref(db,'leave_requests'),d.req); await push(ref(db,'audit_logs'),d.al); }
  else if(type==='auto_out'){ await update(ref(db,`attendance/${d.uid}`),d.upd); await push(ref(db,'audit_logs'),d.al); await push(ref(db,'notifications'),d.nt); }
}
async function safeOp(fn,qType,qData){
  if(!S.isOnline){ addQ(qType,qData); return {ok:false,q:true}; }
  try{ await fn(); return {ok:true}; } catch(e){ if(!navigator.onLine){ addQ(qType,qData); return {ok:false,q:true}; } throw e; }
}

/* ── CLOCK IN/OUT (IP CAPTURE ADDED) ── */
async function userClockAction(type){
  if(S.isProcessing['clock']) return;
  const now=new Date(), mon=now.getMonth(), day=now.getDate(), key=`${mon}_${day}`, uid=S.currentUser.id;
  if(type==='P'){
    const att=S.attendance[uid]||{};
    if(att[key]==='P' && !att[`${key}_out`]){ showToast('Already clocked in today','error'); return; }
  }
  S.isProcessing['clock'] = true;
  try{
    if(type==='P'){
      // Capture IP
      let ip = '';
      try {
        const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(4000) });
        if(res.ok){ const data = await res.json(); ip = data.ip || ''; }
      } catch {}
      const lm = lateMins(now,uid,mon);
      const upd = { [key]:'P', [`${key}_time`]:now.toISOString(), [`${key}_ip`]:ip };
      if(lm>0) upd[`${key}_late`] = lm;
      localStorage.setItem('hr_lc', JSON.stringify({uid,key}));
      const al = { name:S.currentUser.fullName, action: lm>0?`CLOCK IN (${lm}m late)`:'CLOCK IN', timestamp:now.toISOString(), empID:uid, department:S.currentUser.dept, time:now.toLocaleTimeString() };
      const r = await safeOp(async()=>{ await update(ref(db,`attendance/${uid}`),upd); await push(ref(db,'audit_logs'),al); },'clock_in',{uid,upd,al});
      if(r.ok||r.q){ showToast(r.ok?(lm>0?`Clocked in — ${lm} min late`:'Clocked in! 👋'):'Offline — clock in queued',r.ok?'success':'info'); document.getElementById('btnClockIn').classList.add('hidden'); document.getElementById('btnClockOut').classList.remove('hidden'); }
    } else {
      let ck=key; try{ const p=JSON.parse(localStorage.getItem('hr_lc')||'{}'); if(p.uid===uid&&p.key) ck=p.key; }catch{}
      const att=S.attendance[uid]||{};
      if(!att[`${key}_time`]){ const y=new Date(now); y.setDate(y.getDate()-1); const yk=`${y.getMonth()}_${y.getDate()}`; if(att[`${yk}_time`]&&!att[`${yk}_out`]) ck=yk; }
      const upd = { [`${ck}_out`]:now.toISOString() };
      const al = { name:S.currentUser.fullName, action:'CLOCK OUT', timestamp:now.toISOString(), empID:uid, department:S.currentUser.dept, time:now.toLocaleTimeString() };
      const nt = { userId:uid, title:'Clock Out', message:`Clocked out at ${now.toLocaleTimeString()}`, type:'info', timestamp:now.toISOString(), read:false };
      const r = await safeOp(async()=>{ await update(ref(db,`attendance/${uid}`),upd); await push(ref(db,'audit_logs'),al); await push(ref(db,'notifications'),nt); },'clock_out',{uid,upd,al,nt});
      if(r.ok||r.q){ showToast(r.ok?'Clocked out successfully!':'Offline — clock out queued',r.ok?'success':'info'); localStorage.removeItem('hr_lc'); hideBanner(); document.getElementById('btnClockIn').classList.remove('hidden'); document.getElementById('btnClockOut').classList.add('hidden'); }
    }
  } catch { showToast(navigator.onLine?'Failed to record action':'Offline — action queued','error'); }
  finally { S.isProcessing['clock']=false; }
}

/* ── ADMIN CLOCK OUT (MANUAL) ── */
async function adminClockOut(employeeId){
  if(!confirm(`Clock out employee ${S.users[employeeId]?.fullName || employeeId}?`)) return;
  const now = new Date();
  const mon = now.getMonth();
  const day = now.getDate();
  const key = `${mon}_${day}`;
  let ck = key;
  const att = S.attendance[employeeId] || {};
  if(!att[`${key}_time`]){
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    const yk = `${yesterday.getMonth()}_${yesterday.getDate()}`;
    if(att[`${yk}_time`] && !att[`${yk}_out`]) ck = yk;
  }
  const upd = { [`${ck}_out`]: now.toISOString() };
  const al = {
    name: `${S.currentUser.fullName} (admin)`,
    action: `Manually clocked out ${S.users[employeeId]?.fullName || employeeId}`,
    timestamp: now.toISOString(),
    empID: employeeId,
    department: S.users[employeeId]?.dept || '',
    time: now.toLocaleTimeString()
  };
  const nt = {
    userId: employeeId,
    title: 'Manual Clock-Out',
    message: `You were clocked out by ${S.currentUser.fullName} at ${now.toLocaleTimeString()}.`,
    type: 'warning',
    timestamp: now.toISOString(),
    read: false
  };
  try {
    await update(ref(db, `attendance/${employeeId}`), upd);
    await push(ref(db, 'audit_logs'), al);
    await push(ref(db, 'notifications'), nt);
    showToast(`Clocked out ${S.users[employeeId]?.fullName || employeeId}`, 'success');
  } catch(e) {
    showToast('Failed to clock out employee', 'error');
  }
}
window.adminClockOut = adminClockOut;

onAuthStateChanged(auth, async (user)=>{
  if(user){
    if(!S.currentUser){
      try{
        const snap = await get(ref(db, `users/${user.uid}`));
        if(snap.exists()){
          const data = snap.val();
          if(data.disabled){ await signOut(auth); showFE('loginError','Account disabled. Contact admin.'); return; }
          S.currentUser = {id:user.uid, ...data};
          const k = qk(); if(k){ try{ const q = localStorage.getItem(k); if(q) S.offlineQueue = JSON.parse(q); }catch{} }
          showApp(); setupListeners();
        } else { await signOut(auth); showFE('loginError','No employee profile found.'); }
      } catch(e){ await signOut(auth); showFE('loginError', e?.code==='PERMISSION_DENIED'?'Database access denied.':'Could not load profile.'); }
    }
  } else {
    if(S.currentUser) doLogout();
  }
});

function renderAttendance(){
  if(!isAH()){ document.getElementById('payTable').innerHTML='<div style="padding:32px;text-align:center;color:var(--muted);">Access restricted to HR and Admin</div>'; return; }
  const el = document.getElementById('payTable'); if(!el) return;
  const now = new Date();
  const mon = parseInt(document.getElementById('pMonth').value);
  // FIXED year calculation
  let year = now.getFullYear();
  if(mon > now.getMonth() || (now.getMonth()===0 && mon===11)) year--;  // robust cross-year
  const sf = (document.getElementById('pShiftSearch')?.value||'').trim().toLowerCase();
  const per = document.getElementById('pPeriod').value;
  const [pS,pEr] = per.split('-').map(Number);
  const dim = new Date(year, mon+1, 0).getDate();
  const pE = pEr>=28 ? dim : pEr;
  let html = `<table style="min-width:${600+(pE-pS+1)*52}px;"><thead><tr><th>Emp ID</th><th>Name</th><th>Dept</th><th>Shift</th>`;
  for(let d=pS; d<=pE; d++) html += `<th style="min-width:50px;">${d}</th>`;
  html += `<th style="min-width:80px;background:#fef2f2;color:#991b1b;">Lates (min)</th></tr></thead><tbody>`;
  for(const [uid,u] of aes()){
    const sh = u['shift_'+mon]||u.defaultShift||'';
    if(sf && !sh.toLowerCase().includes(sf)) continue;
    html += `<tr><td style="font-weight:600;">${esc(u.empID||uid)}</td><td>${esc(u.fullName)}</td><td>${esc(u.dept)}</td><td style="font-size:11px;color:var(--muted);">${esc(sh)}</td>`;
    let tl = 0;
    const att = S.attendance[uid]||{};
    for(let d=pS; d<=pE; d++){
      const k = `${mon}_${d}`;
      const st = att[k]||'';
      const late = att[`${k}_late`]||0;
      if(late) tl += parseInt(late);
      html += `<td class="att-cell s-${st}" onclick="changeAttendanceStatus('${uid}','${k}')">${esc(st)}${late?`<span class="late-tag">${late}m</span>`:''}</td>`;

/* ── PAYROLL MODULE ── */
function buildRows(mon,pS,pE,year){
  const rows = []; let sn = 1;
  for(const [uid,u] of aes()){
    const att = S.attendance[uid]||{};
    const salary = Math.max(0, parseFloat(u.monthlySalary)||0);
    const cutoff = salary/2;
    const daily = salary/WD;
    let pCnt=0, rdsCnt=0, hdCnt=0, absDays=0, lMin=0, utHrs=0;
    for(let d=pS; d<=pE; d++){
      const k = `${mon}_${d}`, st = att[k]||'', late = parseInt(att[`${k}_late`]||0);
      lMin += late;
      switch(st){
        case 'P': pCnt++; break;
        case 'RDS': rdsCnt++; break;
        case 'HD': hdCnt++; break;
        case 'UT': pCnt++; utHrs++; break;
        case 'A': case 'NPL': case 'NPSL': case 'S': absDays++; break;
      }
    }
    const meal = pCnt*200 + rdsCnt*200 + hdCnt*100;
    const transpo = Math.max(0, parseFloat(u.transpoAllow)||0);
    const stat = Math.max(0, parseFloat(u.statBenefits)||0);
    const bday = 0, regHolDays=0, regHol=0, specHolDays=0, specHol=0;
    const nh = computeNightHrs(uid,mon,pS,pE);
    const nd = nh * (daily/8) * 0.10;
    const colK = daily;
    const totalAllow = colK + meal + transpo + bday + nd + stat + regHol + specHol;
    const absAmt = absDays * daily;
    const tardAmt = lMin>0 ? (lMin/60)*(daily/8) : 0;
    const utAmt = utHrs>0 ? utHrs*(daily/8) : 0;
    const totalDeduct = absAmt + tardAmt + utAmt;
    const net = cutoff + meal + transpo + bday + nd + stat + regHol + specHol - totalDeduct;
    const {L,F} = splitName(u.fullName);
    const empNo = u.empID || uid;
    rows.push({sn,uid,L,F,pos:u.position||u.dept||'',full:u.fullName||'',salary,cutoff,daily,colK,meal,transpo,bday,nh,nd,stat,regHolDays,regHol,specHolDays,specHol,totalAllow,absDays,absAmt,lMin,tardAmt,utHrs,utAmt,totalDeduct,net,hd:u.hireDate||'',empNo,pCnt,rdsCnt,hdCnt});
    sn++;
  }
  return rows;
}
